<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartLocker</title>
    <link rel="icon" type="image/jpeg" href="./assets/shipmates-logo.jpg" />
    <link rel="apple-touch-icon" href="./assets/shipmates-logo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Material+Symbols+Outlined&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-64UC4BEhTGwk3eGpak4nO2jqtl7liTS+juXkSJ2gPAQPmlClQO7s5UgCeR6US48g"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="./config.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <button class="brand" data-route="lockerScan" type="button">
          <span class="brand-mark">
            <img src="./assets/shipmates-logo.jpg" alt="Shipmates" />
          </span>
          <span>
            <strong>SmartLocker</strong>
            <small>Mạng lưới tủ khóa thông minh</small>
          </span>
        </button>
        <button class="account-pill account-button" data-route="profile" type="button">
          <span id="roleBadge" class="role-badge">Chưa đăng nhập</span>
          <span id="accountName">Đăng nhập</span>
          <span class="avatar">T</span>
        </button>
      </header>

      <section class="workspace">
        <section id="view" class="screen" aria-live="polite"></section>
        <aside id="stepPanel" class="step-panel" aria-label="Tiến trình workflow"></aside>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Điều hướng chính">
      <button class="nav-item nav-scan" data-route="lockerScan" type="button">
        <span class="material-symbols-outlined nav-icon">qr_code_scanner</span>
        <span>Quét tủ</span>
      </button>
      <button class="nav-item active" data-route="home" type="button">
        <span class="material-symbols-outlined nav-icon">home</span>
        <span>Trang chủ</span>
      </button>
      <button class="nav-item" data-route="orders" type="button">
        <span class="material-symbols-outlined nav-icon">inventory_2</span>
        <span id="ordersNavLabel">Đơn hàng</span>
      </button>
      <button class="nav-item" data-route="history" type="button">
        <span class="material-symbols-outlined nav-icon">history</span>
        <span id="historyNavLabel">Lịch sử</span>
      </button>
      <button class="nav-item" data-route="lockerMap" type="button">
        <span class="material-symbols-outlined nav-icon">map</span>
        <span>Bản đồ</span>
      </button>
      <button class="nav-item" data-route="profile" type="button">
        <span class="material-symbols-outlined nav-icon">account_circle</span>
        <span>Tài khoản</span>
      </button>
    </nav>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="./app.js"></script>
  </body>
</html>
