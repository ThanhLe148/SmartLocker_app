<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartLocker</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="./config.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="phone" aria-label="SmartLocker app">
        <header class="topbar">
          <strong>SmartLocker</strong>
          <div class="account-pill">
            <span id="accountName">demo_account</span>
            <span class="avatar">T</span>
          </div>
        </header>

        <section id="view" class="screen"></section>

        <nav class="bottom-nav" aria-label="Điều hướng chính">
          <button class="nav-item active" data-route="home" type="button">
            <span class="nav-icon">⌂</span>
            <span>Trang chủ</span>
          </button>
          <button class="nav-item" data-route="orders" type="button">
            <span class="nav-icon">▣</span>
            <span>Đơn</span>
          </button>
          <button class="nav-item" data-route="profile" type="button">
            <span class="nav-icon">◎</span>
            <span>Tài khoản</span>
          </button>
        </nav>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
